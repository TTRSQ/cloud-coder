[project]
name = "cloud-coder"
version = "0.1.0"
description = "Run Claude Code workers on a GCE VM over tmux, and stop the VM automatically when everything is idle."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2",
    "pyyaml>=6.0",
    "starlette>=1.7",
    "uvicorn>=0.54",
]

[project.scripts]
cloud-coder = "cloud_coder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_coder", "src/cloud_coder_vm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs against a real GCP project (opt in with --run-e2e)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
